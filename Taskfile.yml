version: '3'

vars:
  APP_NAME: "agentmate"
  BIN_DIR: "bin"
  # VERSION 是应用版本的唯一事实来源。构建时从 git tag 获取
  # （v0.5.0 -> 0.5.0），并通过 `-X main.Version` 注入二进制；
  # 无 tag 的构建回退为 "dev"。发布 CI 显式传入 VERSION=<tag>，
  # 因此浅克隆也绝不会意外发布 "dev" 构建。环境变量在 shell 内读取，
  # 调用方传入的 VERSION 始终优先于 `git describe` 的默认值。
  VERSION:
    sh: 'v="${VERSION:-$(git describe --tags --abbrev=0 2>/dev/null || echo)}"; v="${v#v}"; echo "${v:-dev}"'
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  # 9527: 不用 Wails 默认的 9245，避免和本机同时开发的其他应用（如 agent-go）抢端口
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9527}}'
  # build/package/run 的目标操作系统。默认使用宿主 OS，可通过
  # `wails3 build GOOS=...`（或 GOOS 环境变量）覆盖以进行交叉编译。
  # 下面的任务通过该变量分发到对应的平台 Taskfile。
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  ios: ./build/ios/Taskfile.yml
  android: ./build/android/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  version:sync:
    summary: Rewrites build/config.yml + generated build assets to VERSION (git tag by default)
    desc: |
      The version lives in three generated places (exe VERSIONINFO, NSIS
      VIProductVersion, Info.plist, nfpm version) that all derive from
      build/config.yml. Hand-editing them drifts; this task rewrites
      build/config.yml from VERSION and lets `wails3 update build-assets`
      regenerate the rest.
    cmds:
      - bash scripts/set-version.sh "{{.VERSION}}"

  release:next:
    summary: Suggests the next version from conventional commits and previews release notes
    cmds:
      - bash scripts/release-notes.sh --next

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker
