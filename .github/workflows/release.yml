name: Release

# 手工发布：推送 v* tag，或通过 workflow_dispatch 重新发布已有 tag。
# prepare 解析 tag/commit，gate/windows 并行构建，publish 原子创建或更新
# Release；构建失败不会留下不完整的发布。
#
# 平台范围：**目前仅 Windows。** 维护者的测试环境是 Windows；发布无人能
# 冒烟测试的 linux/macOS 产物，只会附带自动更新器发布一个损坏构建。linux 与
# macOS 任务（AppImage + deb、universal .app + dmg）保留在 git 历史中，等可以
# 验证后再回来。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v0.5.0"
        required: true
      dry_run:
        description: "Build and upload artifacts only; do not create/update the release"
        type: boolean
        default: false

permissions:
  contents: write

# 绝不让两次 tag 推送在 `releases/latest` 上竞争：半发布的 release 正是更新器
# 无法恢复的状态（它会拉取一个指向尚不存在资产的清单）。分组是固定的，而不是
# 按 tag：不同 tag 也必须串行，否则较慢的旧发布可能在较新的发布完成后重新指向
# `latest`。
concurrency:
  group: release-publish
  cancel-in-progress: false

env:
  WAILS_VERSION: v3.1.0
  TASK_VERSION: v3.54.0
  NODE_VERSION: "20.19"

jobs:
  # ------------------------------------------------------------- 准备 ----
  # 解析本次要发布的 tag 与其 commit；tag 必须已经存在。
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Resolve release tag
        id: resolve
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${INPUT_TAG:-$REF_NAME}"
          [ -n "$tag" ] || { echo "::error::release tag is empty"; exit 1; }
          git rev-parse --verify "refs/tags/$tag^{commit}" >/dev/null 2>&1 ||
            { echo "::error::tag $tag does not exist"; exit 1; }
          sha="$(git rev-parse "refs/tags/$tag^{commit}")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "release tag=$tag sha=$sha"

  # ---------------------------------------------------------------- 门禁 ----
  # 便宜、快速的拒绝，运行在我们实际发布的平台上。Windows 上
  # `go vet .`/`go test .` 不需要 cgo 头文件（已移除的 linux 任务需要 GTK4
  # + WebKitGTK），因此比 ubuntu 门禁更快也更贴近现实。它与 Windows 构建
  # *并发*运行；只有 `publish` 等待两者。这里刻意跳过 race 测试：它们让发布
  # 墙钟时间增至三倍，而单元测试已经能捕获这类 bug，且 `ci.yml` 仍会在每次
  # 推送到 main 时运行它们。
  gate:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Toolchain fingerprint
        run: go version && node --version
      - name: Cache frontend node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install frontend dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npm ci
      - name: Frontend (main.go embeds frontend/dist)
        working-directory: frontend
        run: |
          npx tsc --noEmit
          npm run --silent test
          npm run --silent build
      - name: Vet
        run: go vet ./internal/... .
      - name: Test
        run: go test -count=1 ./internal/... .

  # ------------------------------------------------------------- Windows 构建 ----
  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Cache Go CLI tools
        id: go-cli-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/bin/task.exe
            ~/go/bin/wails3.exe
          key: ${{ runner.os }}-go-cli-task-${{ env.TASK_VERSION }}-wails3-${{ env.WAILS_VERSION }}
      - name: Cache frontend node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          # .task/checksum 让 `task windows:build` 在 node_modules 来自缓存时
          # 跳过其 npm install 依赖。
          path: |
            frontend/node_modules
            .task/checksum
          key: ${{ runner.os }}-node-modules-${{ hashFiles('frontend/package-lock.json') }}-task-${{ env.TASK_VERSION }}
      - name: Install Task CLI
        if: steps.go-cli-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # 从 Go 模块代理安装，而不是使用 arduino/setup-task：后者通过 GitHub
          # API 解析 release，曾因共享 runner 的速率限制让 v0.5.13 发布失败。
          # go install 还能固定版本并保持可复现。
          go install github.com/go-task/task/v3/cmd/task@${TASK_VERSION}
      - name: Install Wails CLI
        if: steps.go-cli-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}
      - name: Add Go bin to PATH
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Stamp version (tag -> build assets)
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.tag }}
        run: |
          export VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          bash scripts/set-version.sh "$VERSION"
      # Windows 只发布一个独立 exe，不发布其他内容：没有 NSIS 安装器
      # （因此也不需要 makensis），也没有 zip。同一个文件既是用户下载的内容，
      # 也是更新器原地替换的内容，因此这里正确的形态是裸二进制而不是安装器。
      - name: Build standalone exe
        shell: bash
        run: task windows:build
      - name: Collect release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "bin/agentmate.exe" "dist/AgentMate-windows-amd64.exe"
      - name: Show artifact sizes
        shell: pwsh
        run: Get-ChildItem dist | Select-Object Name, @{n = "MB"; e = { [math]::Round($_.Length / 1MB, 1) } } | Format-Table -AutoSize
      - uses: actions/upload-artifact@v6
        with:
          name: artifacts-windows
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------- 发布 ----
  # 单一原子发布步骤：构建任务上传到一个 artifact 集合，只有此任务创建
  # tag/release，因此失败的构建绝不会留下缺少某个平台的 release。
  #
  # 目前只发布 Windows（见文件顶部的「平台范围」）；linux/macos 任务被移除
  # 而不是禁用，以免该工作流为尚无人能测试的平台半发布。
  publish:
    needs: [prepare, gate, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      # 附注 tag 需要提交者身份；runner 默认没有，导致 `git tag -a` 报
      # "empty ident name"。
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - uses: actions/download-artifact@v7
        with:
          name: artifacts-windows
          path: dist
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # `go install .../cmd/wails3` 会链接 linux 后端（cgo），因此没有 GTK4
      # 头文件就无法构建我们用于清单签名的 CLI——而且缓存的二进制是动态链接的，
      # 没有匹配的共享库也无法 *运行*。缓存只存二进制，不存系统库，所以即使
      # 缓存命中，apt 步骤也必须运行（否则 v0.5.33 会在
      # `wails3 updater manifest` 报 "libwebkitgtk-6.0.so.4: cannot open shared
      # object file"）。
      - name: Cache Wails CLI (manifest signing)
        id: wails-cache
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails3
          key: ${{ runner.os }}-wails3-${{ env.WAILS_VERSION }}
      - name: Install linux cgo headers (wails3 CLI)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Install Wails CLI (manifest signing)
        if: steps.wails-cache.outputs.cache-hit != 'true'
        run: go install "github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}"
      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Verify tag target
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          git fetch --tags origin
          existing="$(git rev-parse "$TAG^{commit}")"
          if [ "$existing" != "$SHA" ]; then
            echo "::error::tag $TAG points at $existing, expected $SHA"
            exit 1
          fi
          echo "tag $TAG points at $SHA"
      - name: Resolve versions
        env:
          TAG_INPUT: ${{ needs.prepare.outputs.tag }}
        run: |
          TAG="$TAG_INPUT"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          printf 'PREV_TAG=%s\n' "$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo '')" >> "$GITHUB_ENV"
      - name: Release notes
        run: bash scripts/release-notes.sh "${PREV_TAG}" "$TAG" > notes.md
      - name: Checksums
        working-directory: dist
        run: sha256sum ./* | sed 's|\./||' > SHA256SUMS
      - name: Sign + emit update manifest
        env:
          UPDATER_SIGNING_KEY: ${{ secrets.UPDATER_SIGNING_KEY }}
        run: |
          key_args=()
          if [ -n "${UPDATER_SIGNING_KEY:-}" ]; then
            printf '%s' "$UPDATER_SIGNING_KEY" > "$RUNNER_TEMP/updater.key"
            chmod 600 "$RUNNER_TEMP/updater.key"
            key_args=(-key "$RUNNER_TEMP/updater.key")
          else
            echo "::warning::UPDATER_SIGNING_KEY is not set — publishing an UNSIGNED manifest. Clients only pin a public key when updatePublicKeyB64 is filled in, so set both or neither."
          fi
          # 清单只应包含可替换的载荷：安装器（.dmg/.deb/.exe-setup）永远无法
          # 重命名覆盖正在运行的安装，列进去只会给用户一个无法应用的下载。
          # Windows 条目是独立 exe——用户下载和更新器替换的是同一个文件。
          cd dist
          wails3 updater manifest \
            -version "$VERSION" \
            -name "AgentMate $TAG" \
            -notes-file ../notes.md \
            -url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/" \
            -output manifest.json \
            "${key_args[@]}" \
            AgentMate-windows-amd64.exe
          cat manifest.json
      - name: Publish release
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # 重新运行已有 tag：原地替换资产并重新指向 `latest`。
            gh release upload "$TAG" --clobber dist/*
            gh release edit "$TAG" --title "AgentMate $TAG" --notes-file notes.md --latest
          else
            gh release create "$TAG" \
              --title "AgentMate $TAG" \
              --notes-file notes.md \
              --latest \
              dist/*
          fi
      - name: Dry run summary
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "dry_run: artifacts built but no release was created"
          ls -lh dist
