name: Release

# 发布列车：tag 推送、main CI 成功、定时兜底与人工 dispatch 都会进入这里。
# plan job 决定“这一轮要不要发版、发哪个 tag”，随后 gate/windows 构建、
# publish 原子发布，并在同一个 run 里关闭本批 issue。本地 issue-fixer 不再
# 打 tag、不再等待 Release run。
#
# Platform scope: **Windows only, for now.** The maintainer's test environment is
# Windows; shipping linux/macOS artifacts that nobody can smoke-test is how you
# publish a broken build with an auto-updater attached to it. The linux and macOS
# jobs (AppImage + deb, universal .app + dmg) are kept in git history and come
# back in a later version once they can be verified.
on:
  push:
    tags: ["v*"]
  # main CI 成功是最及时的信号：合并合入后通常 4-6 分钟就能触发发版评估，
  # 不必等本地 15 分钟定时轮。PR 的 CI 由 head_branch 过滤掉。
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  schedule:
    # 兜底：workflow_run 偶尔漏触发（Actions 调度延迟、仓库静默）时，每 15
    # 分钟评估一次；plan 步骤只做几次 gh 查询，成本很低。
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v0.5.0"
        required: true
      dry_run:
        description: "Build and upload artifacts only; do not create/update the release"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read
  issues: write

# Never let two tag pushes race on `releases/latest`: a half-published release
# is exactly the state the updater cannot recover from (it would fetch a
# manifest that points at assets that do not exist yet). The group is fixed, not
# per-tag: different tags must serialize too, or a slower older release can
# re-point `latest` after a newer one has finished.
concurrency:
  group: release-publish
  cancel-in-progress: false

env:
  WAILS_VERSION: v3.0.0
  TASK_VERSION: v3.54.0
  NODE_VERSION: "20.19"

jobs:
  # ---------------------------------------------------------------- plan ----
  # 决策与补关：plan 不创建 tag；reconcile 只关闭“最近已发布 tag 已包含”的
  # 漏关 issue。真正的 tag / Release 写操作在 publish / cleanup。
  plan:
    # workflow_run 只在 main 的 push CI 成功后继续；schedule 与人工触发总是进入。
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.decide.outputs.should_release }}
      tag: ${{ steps.decide.outputs.tag }}
      sha: ${{ steps.decide.outputs.sha }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      # 上一次发布若在 close 阶段中断，这里按“最近已发布 tag”补关。用独立
      # 状态目录，避免覆盖本轮待发版快照。
      - name: Reconcile pending-release strays
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_STATE_DIR: ${{ runner.temp }}/reconcile
        run: |
          git fetch --tags origin --quiet || exit 0
          latest="$(gh release list --repo "${{ github.repository }}" --limit 1 \
            --json tagName --jq '.[0].tagName // ""')"
          [ -n "$latest" ] || exit 0
          git rev-parse --verify "refs/tags/$latest" >/dev/null 2>&1 || exit 0
          mkdir -p "$ISSUE_STATE_DIR"
          bash scripts/issue-release.sh snapshot >/dev/null || exit 0
          bash scripts/issue-release.sh close "$latest" || true
      - name: Decide release
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          WR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WR_EVENT: ${{ github.event.workflow_run.event }}
          WR_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
          ISSUE_STATE_DIR: ${{ runner.temp }}/issue-fixer
        run: bash scripts/release-train.sh plan
      # 手动 tag / workflow_dispatch 直接发版，不会生成批次快照；只有自动发布
      # 路径（workflow_run / schedule）在 go 之前调用 snapshot()。这里限定事件，
      # 避免手动发版因 if-no-files-found: error 卡住 plan。
      - name: Upload batch snapshot
        if: >-
          steps.decide.outputs.should_release == 'true' &&
          (github.event_name == 'workflow_run' || github.event_name == 'schedule')
        uses: actions/upload-artifact@v6
        with:
          name: release-batch
          path: ${{ runner.temp }}/issue-fixer/release-snapshot.tsv
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------- gate ----
  # Cheap, fast refusal, running on the platform we actually ship. Windows needs
  # no cgo headers for `go vet .`/`go test .` (the removed linux jobs needed GTK4
  # + WebKitGTK), so this is both faster and closer to reality than an ubuntu
  # gate. Runs *concurrently* with the Windows build; only `publish` waits for
  # both. Race tests are deliberately skipped here: they tripled the release
  # wall-clock for a class of bug the unit tests already catch, and `ci.yml`
  # still runs them on every push to main.
  gate:
    needs: plan
    if: needs.plan.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Toolchain fingerprint
        run: go version && node --version
      - name: Cache frontend node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install frontend dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npm ci
      - name: Frontend (main.go embeds frontend/dist)
        working-directory: frontend
        run: |
          npx tsc --noEmit
          npm run --silent test
          npm run --silent build
      - name: Vet
        run: go vet ./internal/... .
      - name: Test
        run: go test -count=1 ./internal/... .

  # ------------------------------------------------------------- windows ----
  windows:
    needs: plan
    if: needs.plan.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Cache Go CLI tools
        id: go-cli-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/bin/task.exe
            ~/go/bin/wails3.exe
          key: ${{ runner.os }}-go-cli-task-${{ env.TASK_VERSION }}-wails3-${{ env.WAILS_VERSION }}
      - name: Cache frontend node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          # .task/checksum lets `task windows:build` skip its npm install
          # dependency when node_modules came from the cache.
          path: |
            frontend/node_modules
            .task/checksum
          key: ${{ runner.os }}-node-modules-${{ hashFiles('frontend/package-lock.json') }}-task-${{ env.TASK_VERSION }}
      - name: Install Task CLI
        if: steps.go-cli-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # Install from the Go module proxy instead of arduino/setup-task:
          # that action resolves the release through GitHub's API and failed
          # the v0.5.13 release on a shared-runner rate limit. go install also
          # keeps the version pinned and reproducible.
          go install github.com/go-task/task/v3/cmd/task@${TASK_VERSION}
      - name: Install Wails CLI
        if: steps.go-cli-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}
      - name: Add Go bin to PATH
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Stamp version (tag -> build assets)
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.tag }}
        run: |
          export VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          bash scripts/set-version.sh "$VERSION"
      # Windows ships one standalone exe and nothing else: no NSIS installer
      # (so no makensis dependency either) and no zip. The same file is both
      # what the user downloads and what the updater swaps in place, which is
      # why a bare binary — not an installer — is the right shape here.
      - name: Build standalone exe
        shell: bash
        run: task windows:build
      - name: Collect release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "bin/agentmate.exe" "dist/AgentMate-windows-amd64.exe"
      - name: Show artifact sizes
        shell: pwsh
        run: Get-ChildItem dist | Select-Object Name, @{n = "MB"; e = { [math]::Round($_.Length / 1MB, 1) } } | Format-Table -AutoSize
      - uses: actions/upload-artifact@v6
        with:
          name: artifacts-windows
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------- publish ----
  # Single atomic publish step: the build jobs upload into one artifact set and
  # only this job creates the tag/release, so a failed build never leaves a
  # release behind that is missing a platform.
  #
  # Only Windows is published for now (see "Platform scope" at the top of the
  # file); the linux/macos jobs are removed rather than disabled so this workflow
  # cannot half-publish for platforms nobody can test yet.
  publish:
    needs: [plan, gate, windows]
    if: needs.plan.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
      # Annotated tags require a committer identity; the runner has none by
      # default, which made `git tag -a` fail with "empty ident name".
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - uses: actions/download-artifact@v7
        with:
          name: artifacts-windows
          path: dist
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # `go install .../cmd/wails3` links the linux backend (cgo), so the CLI we
      # need for manifest signing cannot be built without the GTK4 headers — and
      # the cached binary is dynamically linked, so it cannot *run* without the
      # matching shared libraries either. The cache only stores the binary, not
      # the system libraries, hence the apt step must run even on a cache hit
      # (v0.5.33 failed at `wails3 updater manifest` with
      # "libwebkitgtk-6.0.so.4: cannot open shared object file" otherwise).
      - name: Cache Wails CLI (manifest signing)
        id: wails-cache
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails3
          key: ${{ runner.os }}-wails3-${{ env.WAILS_VERSION }}
      - name: Install linux cgo headers (wails3 CLI)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Install Wails CLI (manifest signing)
        if: steps.wails-cache.outputs.cache-hit != 'true'
        run: go install "github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}"
      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # 自动发版在 build 成功后才创建 tag：构建失败不会留下空 tag。tag 消息
      # 写裸版本号，release-notes.sh 会忽略它并按 conventional commits 生成说明。
      - name: Create tag if missing
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          SHA: ${{ needs.plan.outputs.sha }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          git fetch --tags origin
          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            existing="$(git rev-parse "$TAG^{commit}")"
            if [ "$existing" != "$SHA" ]; then
              echo "::error::tag $TAG points at $existing, expected $SHA"
              exit 1
            fi
            echo "tag $TAG already exists"
          else
            git tag -a "$TAG" "$SHA" -m "$TAG"
            if [ "$DRY_RUN" = "true" ]; then
              echo "dry_run: tag created locally only"
            else
              git push origin "refs/tags/$TAG"
            fi
          fi
      - name: Resolve versions
        env:
          TAG_INPUT: ${{ needs.plan.outputs.tag }}
        run: |
          TAG="$TAG_INPUT"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          printf 'PREV_TAG=%s\n' "$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo '')" >> "$GITHUB_ENV"
      - name: Release notes
        run: bash scripts/release-notes.sh "${PREV_TAG}" "$TAG" > notes.md
      - name: Checksums
        working-directory: dist
        run: sha256sum ./* | sed 's|\./||' > SHA256SUMS
      - name: Sign + emit update manifest
        env:
          UPDATER_SIGNING_KEY: ${{ secrets.UPDATER_SIGNING_KEY }}
        run: |
          key_args=()
          if [ -n "${UPDATER_SIGNING_KEY:-}" ]; then
            printf '%s' "$UPDATER_SIGNING_KEY" > "$RUNNER_TEMP/updater.key"
            chmod 600 "$RUNNER_TEMP/updater.key"
            key_args=(-key "$RUNNER_TEMP/updater.key")
          else
            echo "::warning::UPDATER_SIGNING_KEY is not set — publishing an UNSIGNED manifest. Clients only pin a public key when updatePublicKeyB64 is filled in, so set both or neither."
          fi
          # Only the swappable payloads belong in the manifest: an installer
          # (.dmg/.deb/.exe-setup) can never be renamed over a running install,
          # so listing one would offer users a download that cannot apply. The
          # Windows entry is the standalone exe — same file users download and
          # the updater replaces.
          cd dist
          wails3 updater manifest \
            -version "$VERSION" \
            -name "AgentMate $TAG" \
            -notes-file ../notes.md \
            -url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/" \
            -output manifest.json \
            "${key_args[@]}" \
            AgentMate-windows-amd64.exe
          cat manifest.json
      - name: Publish release
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-run of an existing tag: replace assets in place and re-point
            # `latest` at it.
            gh release upload "$TAG" --clobber dist/*
            gh release edit "$TAG" --title "AgentMate $TAG" --notes-file notes.md --latest
          else
            gh release create "$TAG" \
              --title "AgentMate $TAG" \
              --notes-file notes.md \
              --latest \
              dist/*
          fi
      - name: Download batch snapshot
        if: ${{ github.event.inputs.dry_run != 'true' }}
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: release-batch
          path: ${{ runner.temp }}/issue-fixer
      - name: Close released issues
        if: ${{ github.event.inputs.dry_run != 'true' }}
        # close 失败不把整个 run 判失败：下一次 plan 的 reconcile 会补关，
        # 避免 cleanup 把已经关闭的票重新标成 retryable。
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_STATE_DIR: ${{ runner.temp }}/issue-fixer
        run: |
          snapshot="$ISSUE_STATE_DIR/release-snapshot.tsv"
          if [ ! -f "$snapshot" ]; then
            echo "no batch snapshot; nothing to close"
            exit 0
          fi
          bash scripts/issue-release.sh close "$TAG"
      - name: Dry run summary
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "dry_run: artifacts built but no release was created"
          ls -lh dist

  # ------------------------------------------------------------- cleanup ----
  # 构建/发布失败时只处理本轮快照里的 pending issue：保留 agent:pending-release
  # 并加 agent:blocked + agent:retryable，发布列车稍后重试同一个 tag。
  cleanup:
    needs: [plan, gate, windows, publish]
    if: >-
      failure() &&
      needs.plan.outputs.should_release == 'true' &&
      needs.publish.result != 'success' &&
      github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download batch snapshot
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: release-batch
          path: ${{ runner.temp }}/issue-fixer
      - name: Mark released batch retryable
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_STATE_DIR: ${{ runner.temp }}/issue-fixer
        run: |
          snapshot="$ISSUE_STATE_DIR/release-snapshot.tsv"
          if [ ! -f "$snapshot" ]; then
            echo "no batch snapshot; nothing to mark"
            exit 0
          fi
          bash scripts/issue-release.sh fail \
            "Release run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} 失败"
