name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The root package imports Wails' linux backend, so vetting/testing it
      # needs GTK4 + WebKitGTK 6 headers through cgo. Without them the job dies
      # on pkg-config before it ever reaches the code.
      - name: Install linux cgo headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Build frontend (main.go embeds frontend/dist)
        working-directory: frontend
        run: |
          npm ci
          npm run --silent test
          npm run --silent build
      - name: Vet
        run: go vet ./internal/... .
      - name: Test
        run: go test -count=1 ./internal/... .
      - name: Race
        run: go test -race -count=1 ./internal/... .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Build
        working-directory: frontend
        run: npm run --silent build
