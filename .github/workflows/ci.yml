name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"
      - ".gitignore"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check Windows build coverage
        run: bash scripts/check-ci-build-coverage.sh
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Cache frontend node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('frontend/package-lock.json') }}
      # The root package imports Wails' linux backend, so vetting/testing it
      # needs GTK4 + WebKitGTK 6 headers through cgo. Without them the job dies
      # on pkg-config before it ever reaches the code.
      - name: Install linux cgo headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Install frontend dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npm ci
      - name: Build frontend (main.go embeds frontend/dist)
        working-directory: frontend
        run: |
          npm run --silent test
          npm run --silent build
      - name: Vet
        run: go vet ./internal/... .
      - name: Test
        run: go test -count=1 ./internal/... .
      - name: Race
        run: go test -race -count=1 ./internal/... .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Cache frontend node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install
        if: steps.node-modules.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Build
        working-directory: frontend
        run: npm run --silent build

  # The push/PR gate above only tests Go packages and builds frontend assets;
  # it never compiles the Wails desktop app. A change can therefore pass CI and
  # still fail at release time on `-tags production`/windowsgui/syso. Build the
  # Windows exe here, before a tag exists, so the auto-fix flow never has to
  # discover a broken build after pushing a tag.
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      WAILS_VERSION: v3.1.0
      TASK_VERSION: v3.54.0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Cache Go CLI tools
        id: go-cli-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/bin/task.exe
            ~/go/bin/wails3.exe
          key: ${{ runner.os }}-go-cli-task-${{ env.TASK_VERSION }}-wails3-${{ env.WAILS_VERSION }}
      - name: Cache frontend node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          # .task/checksum lets `task windows:build` skip its npm install
          # dependency when node_modules came from the cache.
          path: |
            frontend/node_modules
            .task/checksum
          key: ${{ runner.os }}-node-modules-${{ hashFiles('frontend/package-lock.json') }}-task-${{ env.TASK_VERSION }}
      - name: Install Task CLI
        if: steps.go-cli-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # Install from the Go module proxy instead of arduino/setup-task:
          # that action resolves the release through GitHub's API and hit a
          # shared-runner rate limit on #39's CI. go install also keeps the
          # version pinned and reproducible (same as release.yml).
          go install github.com/go-task/task/v3/cmd/task@${TASK_VERSION}
      - name: Install Wails CLI
        if: steps.go-cli-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}
      - name: Add Go bin to PATH
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build Windows exe
        shell: bash
        run: task windows:build
      # Release runs its gate on windows-latest; keep the same test command here
      # so a Windows-only failure is caught on the push, not after a tag exists.
      # frontend/dist is already built by the step above (main.go embeds it).
      - name: Test (windows)
        shell: bash
        run: go test -count=1 ./internal/... .
