name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"
      - ".gitignore"

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check Windows build coverage
        run: bash scripts/check-ci-build-coverage.sh
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The root package imports Wails' linux backend, so vetting/testing it
      # needs GTK4 + WebKitGTK 6 headers through cgo. Without them the job dies
      # on pkg-config before it ever reaches the code.
      - name: Install linux cgo headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Build frontend (main.go embeds frontend/dist)
        working-directory: frontend
        run: |
          npm ci
          npm run --silent test
          npm run --silent build
      - name: Vet
        run: go vet ./internal/... .
      - name: Test
        run: go test -count=1 ./internal/... .
      - name: Race
        run: go test -race -count=1 ./internal/... .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Build
        working-directory: frontend
        run: npm run --silent build

  # The push/PR gate above only tests Go packages and builds frontend assets;
  # it never compiles the Wails desktop app. A change can therefore pass CI and
  # still fail at release time on `-tags production`/windowsgui/syso. Build the
  # Windows exe here, before a tag exists, so the auto-fix flow never has to
  # discover a broken build after pushing a tag.
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      WAILS_VERSION: v3.0.0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: arduino/setup-task@v3
        with:
          version: 3.x
      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build Windows exe
        shell: bash
        run: task windows:build
