name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"
      - ".gitignore"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check Windows build coverage
        run: bash scripts/check-ci-build-coverage.sh
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Cache frontend node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('frontend/package-lock.json') }}
      # 根包导入 Wails 的 linux 后端，因此 vet/测试它需要 GTK4 + WebKitGTK 6
      # 头文件（通过 cgo）。没有它们，任务会在 pkg-config 阶段失败，根本到不了
      # 代码。
      - name: Install linux cgo headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Install frontend dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npm ci
      - name: Build frontend (main.go embeds frontend/dist)
        working-directory: frontend
        run: |
          npm run --silent test
          npm run --silent build
      - name: Vet
        run: go vet ./internal/... .
      - name: Test
        run: go test -count=1 ./internal/... .
      - name: Race
        run: go test -race -count=1 ./internal/... .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Cache frontend node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install
        if: steps.node-modules.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Build
        working-directory: frontend
        run: npm run --silent build

  # 上面的 push/PR 门禁只测试 Go 包并构建前端资产；它从不编译 Wails 桌面
  # 应用。因此改动可能通过 CI，却在发布时因 `-tags production`/windowsgui/syso
  # 失败。在 tag 存在之前就在这里构建 Windows exe，这样发布永远不必在推送 tag
  # 后才发现构建已损坏。
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      WAILS_VERSION: v3.1.0
      TASK_VERSION: v3.54.0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Cache Go CLI tools
        id: go-cli-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/bin/task.exe
            ~/go/bin/wails3.exe
          key: ${{ runner.os }}-go-cli-task-${{ env.TASK_VERSION }}-wails3-${{ env.WAILS_VERSION }}
      - name: Cache frontend node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          # .task/checksum 让 `task windows:build` 在 node_modules 来自缓存时
          # 跳过其 npm install 依赖。
          path: |
            frontend/node_modules
            .task/checksum
          key: ${{ runner.os }}-node-modules-${{ hashFiles('frontend/package-lock.json') }}-task-${{ env.TASK_VERSION }}
      - name: Install Task CLI
        if: steps.go-cli-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # 从 Go 模块代理安装，而不是使用 arduino/setup-task：后者通过 GitHub
          # API 解析 release，曾在 #39 的 CI 上遇到共享 runner 速率限制。
          # go install 还能固定版本并保持可复现（与 release.yml 相同）。
          go install github.com/go-task/task/v3/cmd/task@${TASK_VERSION}
      - name: Install Wails CLI
        if: steps.go-cli-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}
      - name: Add Go bin to PATH
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build Windows exe
        shell: bash
        run: task windows:build
      # Release 在 windows-latest 上运行门禁；这里保持相同的测试命令，让仅
      # Windows 才出现的失败在 push 时就被捕获，而不是等 tag 存在之后。
      # frontend/dist 已由上一步构建（main.go 会嵌入它）。
      - name: Test (windows)
        shell: bash
        run: go test -count=1 ./internal/... .
