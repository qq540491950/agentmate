name: Bug 报告
description: 测试机上发现的问题；按此模板填写，便于复现和定位
title: "[模块] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请尽量填写完整。**一个 issue 只描述一个问题**；多个问题请分别提交。

        标题格式：`[模块] 简短现象`，模块可用 `chat`、`agents`、`teams`、`skills`、`mcp`、`models`、`settings`、`workspace`、`update`、`other`。

        本仓库是公开的，提交前请移除日志中的 API Key、Token、账号和个人路径等敏感信息。
  - type: input
    id: version
    attributes:
      label: 版本 / commit
      description: 应用内「反馈问题」入口会自动填入；直接在 GitHub 提交可留空
      placeholder: v0.5.0 或 624feae
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: 测试环境
      description: Windows 版本与架构，以及问题相关的模型、MCP、Agent、工作区配置
      placeholder: |
        Windows 11 23H2 x64
        模型：OpenAI 兼容 / gpt-4o
        MCP：filesystem
        工作区：D:\agentmate-test
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从打开应用开始的最小步骤，尽量能稳定复现
      placeholder: |
        1. 打开应用，新建会话
        2. 发送“列出当前目录文件”
        3. 在工具确认弹窗点“允许”
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
      description: 你认为正确应该发生什么
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 实际发生了什么，包括错误提示原文；界面问题请同时附截图
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 粘贴错误前后各 30～50 行日志，截图可直接拖入。请先脱敏。
      render: text
    validations:
      required: false
  - type: dropdown
    id: frequency
    attributes:
      label: 复现频率
      options:
        - 必现
        - 经常
        - 偶现
        - 只出现一次
    validations:
      required: true
  - type: input
    id: scope
    attributes:
      label: 前置条件（可选）
      description: 是否只在特定会话、工作区、模型或 MCP 下出现；最近是否升级或改过配置
      placeholder: 例：只在启用 filesystem MCP 时出现
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前确认
      options:
        - label: 我已移除日志中的 API Key、Token、账号和个人路径等敏感信息
          required: true
        - label: 一个 issue 只描述一个问题（多个问题请分别提交）
          required: true
